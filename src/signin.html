<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeAmigos | Sign In</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Floating animation */
    #background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(188, 212, 242, 0.15);
      animation: float 12s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); opacity: 0.6; }
      50% { transform: translateY(-40px) scale(1.2); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 0.6; }
    }

    header, footer {
      background-color: #161b22;
      position: relative;
      z-index: 1;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
    }

    .form-control {
      background-color: #0d1117;
      border-color: #30363d;
      color: #fff;
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    .form-control:focus {
      border-color: #58a6ff;
      box-shadow: 0 0 5px rgba(88,166,255,0.5);
    }

    .is-invalid {
      border-color: #dc3545 !important;
      box-shadow: 0 0 8px rgba(220,53,69,0.4);
    }

    /* Animated error text */
    .error-text {
      color: #dc3545;
      font-size: 0.85em;
      opacity: 0;
      transition: opacity 0.5s ease;
      height: 0;
      overflow: hidden;
      margin-top: 4px;
    }

    .error-text.show {
      opacity: 1;
      height: auto;
    }

    a {
      color: #58a6ff;
    }

    footer p {
      color: #8b949e;
      font-size: 0.85em;
    }
  </style>
</head>

<body>
  <!-- Background floating circles -->
  <div id="background"></div>

  <!-- Header -->
  <header class="d-flex justify-content-between align-items-center px-4 py-3 shadow-sm">
    <h3 class="text-light m-0 fw-bold">CodeAmigos</h3>
    <nav>
      <a href="welcome.html" class="text-decoration-none text-light me-4" style="font-size: 1rem;">Home</a>
      <a href="#" class="text-decoration-none text-primary" style="font-size: 1rem;">Help</a>
    </nav>
  </header>

  <!-- Sign-In Section -->
  <section class="d-flex flex-column align-items-center justify-content-center text-center" style="height: 80vh; position: relative; z-index: 1;">
    <div class="card p-4 shadow-lg border-0" style="width: 340px;">
      <h2 class="text-light mb-4">Sign In</h2>

      <form id="signinForm" novalidate>
        <!-- Username -->
        <div class="text-start mb-3">
          <label for="username" class="form-label text-light fw-semibold" style="font-size: 0.9em;">
            Username or Email
          </label>
          <input
            type="text"
            id="username"
            class="form-control"
            placeholder="Enter your email"
            required
          />
          <div id="usernameError" class="error-text">Please enter a valid username or email.</div>
        </div>

        <!-- Password -->
        <div class="text-start mb-2">
          <label for="password" class="form-label text-light fw-semibold" style="font-size: 0.9em;">
            Password
          </label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Enter your password"
            required
          />
          <div id="passwordError" class="error-text">
            Password must be at least 8 characters, include one number and one lowercase letter.
          </div>
        </div>

        <div class="text-end">
          <a href="#" class="text-decoration-none" style="font-size: 0.85em;">Forgot password?</a>
        </div>

        <!-- Sign-In Button -->
        <button
          type="submit"
          class="btn w-100 mt-4"
          style="background-color: #238636; color: #fff; border-radius: 6px;"
        >
          Sign In
        </button>

        <!-- Create Account -->
        <div class="mt-3" style="font-size: 0.9em; color: #8b949e;">
          New to CodeAmigos?
          <a href="firstpage.html" class="text-decoration-none text-primary">
            Create an account
          </a>
        </div>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="text-center py-3 mt-auto">
    <p class="mb-0">© 2025 CodeAmigos. All rights reserved.</p>
  </footer>

  <!-- Floating circles script -->
  <script>
    // Floating background
    const bg = document.getElementById("background");
    for (let i = 0; i < 20; i++) {
      const circle = document.createElement("div");
      const size = Math.random() * 120 + 30;
      circle.style.width = size + "px";
      circle.style.height = size + "px";
      circle.style.top = Math.random() * 100 + "%";
      circle.style.left = Math.random() * 100 + "%";
      circle.style.animationDelay = Math.random() * 10 + "s";
      circle.classList.add("circle");
      bg.appendChild(circle);
    }

    // Validation logic

document.getElementById("signinForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();

  const response = await fetch("http://localhost:5000/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  });

  const data = await response.json();

  if (data.success) {
    alert("✅ Login successful!");
    window.location.href = "dashboard.html";
  } else {
    alert("❌ " + data.message);
  }
});
</script>
</body>
</html>
